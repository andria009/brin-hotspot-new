limit_req_zone $server_name zone=hotspot_map_rate:1m rate=30r/s;
limit_conn_zone $server_name zone=hotspot_map_conn:1m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hotspot GeoJSON responses are tens of MB uncompressed.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json text/css application/javascript;

  # shortcut: shared cap behind Caddy; use edge IP limits when traffic grows.
  location = /api/v1/hotspots {
    limit_req zone=hotspot_map_rate burst=60 nodelay;
    limit_conn hotspot_map_conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://api:8000/api/v1/hotspots;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
